<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>雅译悬浮按钮交互测试</title>
  <link rel="stylesheet" href="../../src/content.css">
  <style>
    body { min-height: 160vh; margin: 0; padding: 60px; background: #f3efe5; color: #17231d; font: 16px/1.8 system-ui, sans-serif; }
    article { max-width: 720px; margin: auto; padding: 42px; border: 1px solid #d8d3c7; background: #fff; }
    .video-stage { position: relative; width: 720px; max-width: 100%; aspect-ratio: 16 / 9; margin: 30px auto; background: #111; }
    video { display: block; width: 100%; height: 100%; background: linear-gradient(145deg, #17231d, #345f4e); }
  </style>
</head>
<body>
  <article data-yayi-ignore>
    <h1>悬浮按钮交互测试</h1>
    <p>按钮应贴在视口边缘；点击后显示四种翻译服务，拖动并松开后吸附到最近一侧。</p>
  </article>
  <div class="video-stage"><video muted aria-label="测试视频"></video></div>
  <script>
    const listeners = [];
    window.chrome = {
      runtime: {
        lastError: null,
        onMessage: { addListener() {} },
        openOptionsPage() { window.__yayiOptionsOpened = true; },
        sendMessage(message, callback) {
          if (message.type === "GET_SETTINGS") callback({
            ok: true,
            settings: {
              provider: "openai",
              openaiModel: "gpt-5.6-luna",
              geminiModel: "gemini-3.7-flash",
              customModel: "private-model",
              floatingButtonSide: "right",
              floatingButtonY: 0.38,
              translateSubtitles: true,
              batchSize: 18,
              minTextLength: 2
            }
          });
          else if (message.type === "TRANSLATE") {
            window.__yayiTranslated = message.texts;
            callback({ ok: true, translations: message.texts.map(() => "这是限制在视频画面内的测试字幕。") });
          }
        }
      },
      storage: {
        local: {
          async set(value) {
            window.__yayiSaved = { ...(window.__yayiSaved || {}), ...value };
            const changes = Object.fromEntries(Object.entries(value).map(([key, newValue]) => [key, { newValue }]));
            listeners.forEach((listener) => listener(changes, "local"));
          }
        },
        onChanged: { addListener(listener) { listeners.push(listener); } }
      }
    };
  </script>
  <script src="../../src/content.js"></script>
  <script>
    setTimeout(() => {
      const caption = document.createElement("div");
      caption.className = "caption-window";
      caption.textContent = "This subtitle must remain inside the video.";
      document.body.appendChild(caption);
    }, 80);
  </script>
</body>
</html>
